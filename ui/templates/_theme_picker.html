{% if is_admin %}
<div class="theme-picker-backdrop" data-theme-backdrop hidden>
  <div class="theme-picker" role="dialog" aria-modal="true" aria-labelledby="theme-picker-title">
    <div class="theme-picker-head">
      <div>
        <h2 id="theme-picker-title">Сменить дизайн</h2>
        <p>По умолчанию для всех — «Документы». Темы Carwow и остальные превью доступны только вам в этом браузере.</p>
      </div>
      <button type="button" class="theme-picker-close" data-theme-close aria-label="Закрыть">×</button>
    </div>
    <div class="theme-picker-grid">
      <button type="button" class="theme-option" data-theme-id="docs">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Документы</strong>
          <small>Текущий дизайн для всех: pine-шапка, зелёный фон, светлые карточки.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="docs.mod">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Документы.mod</strong>
          <small>Cold forest: cool spruce chrome, bone cards, sans display, pewter accent.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carbon">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Карбон</strong>
          <small>Антрацит, кислотная бирюза, мокрый асфальт и racing green.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carbon.mod">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Карбон.mod</strong>
          <small>Industrial: cool zinc, IBM-blue accent, sharp 2px corners, denser chrome.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow</strong>
          <small>Как carwow.co.uk: тёмный header, cyan CTA #1CDCE8, светло-серый контент.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow.mod">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow.mod</strong>
          <small>Cyan locked + cooler zinc content, sharper cards, hover lift.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow-soft">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow Soft</strong>
          <small>Светлый marketplace: белая шапка, cyan-акценты, мягкие pill-кнопки.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow-soft.mod">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow Soft.mod</strong>
          <small>Monochrome + cyan pop: hairlines, soft-square cards, pill CTAs only.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow-night">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow Night</strong>
          <small>Полный charcoal #171717 с фирменным cyan и тёмными карточками.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="carwow-night.mod">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Carwow Night.mod</strong>
          <small>Near-black zinc + singular cyan, restrained glow, teal offer.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="original">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Оригинал</strong>
          <small>Прежний светлый сайт с зелёным акцентом.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="parchment">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Пергамент</strong>
          <small>Светлая бумага, serif-бренд, золотая линия у активных вкладок.</small>
        </span>
      </button>
      <button type="button" class="theme-option" data-theme-id="forest">
        <span class="theme-option-swatch" aria-hidden="true"><span></span><span></span></span>
        <span>
          <strong>Хвойный</strong>
          <small>Насыщенный лесной акцент и плотные зелёные кнопки.</small>
        </span>
      </button>
    </div>
    <p class="theme-picker-note">Выбор сохраняется в localStorage этого браузера.</p>
  </div>
</div>
{% endif %}
