<div class="no-volume-editor" data-no-volume-editor>
  <label class="no-volume-field">
    <span class="no-volume-label">Объём, л</span>
    <input
      type="text"
      class="no-volume-input"
      inputmode="decimal"
      placeholder="1.6"
      aria-label="Объём двигателя в литрах"
    >
  </label>
  <button type="button" class="no-volume-save">Сохранить</button>
  <span class="no-volume-status" data-no-volume-status aria-live="polite"></span>
</div>
