{% if is_admin %}
<div class="pill accent admin-mode-pill">
  Режим администратора
  <a class="admin-mode-link" href="{{ url_for('logout') }}">Выйти</a>
</div>
<a class="admin-enter-link" href="{{ url_for('admin_contracts') }}">Договоры</a>
<a class="admin-enter-link" href="{{ url_for('admin_feedback') }}">
  Сообщения{% if feedback_unread_count %} <span class="tab-count">{{ feedback_unread_count }}</span>{% endif %}
</a>
{% include "_admin_stats.html" %}
{% elif is_contract_user %}
<div class="pill accent admin-mode-pill">
  <a class="admin-mode-link" href="{{ url_for('admin_contracts') }}">Договоры</a>
  · {{ contract_username }}
  <a class="admin-mode-link" href="{{ url_for('logout') }}">Выйти</a>
</div>
<a class="admin-enter-link" href="{{ url_for('admin_contracts') }}">Договоры</a>
{% elif current_user %}
<a class="admin-enter-link" href="{{ url_for('logout') }}">Выйти</a>
{% endif %}
