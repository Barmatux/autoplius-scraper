{% if is_admin %}
<div class="pill accent admin-mode-pill">
  Режим администратора
  <a class="admin-mode-link" href="{{ url_for('logout') }}">Выйти</a>
</div>
{% include "_admin_stats.html" %}
{% elif current_user %}
<a class="admin-enter-link" href="{{ url_for('cabinet') }}">Кабинет</a>
<a class="admin-enter-link" href="{{ url_for('logout') }}">Выйти</a>
{% else %}
<a class="admin-enter-link" href="{{ url_for('login', next=request.full_path if request.full_path != '?' else request.path) }}">Вход</a>
{% endif %}
