<nav class="tabs">
  <a
    href="{{ url_for('index', tab='all') }}"
    class="tab{% if active_tab == 'all' %} active{% endif %}"
  >Объявления</a>
  <a
    href="{{ url_for('index', tab='no_volume') }}"
    class="tab{% if active_tab == 'no_volume' %} active{% endif %}"
  >Без объема{% if no_volume_count is defined %} <span class="tab-count">{{ no_volume_count }}</span>{% endif %}</a>
  <a
    href="{{ url_for('analytics') }}"
    class="tab{% if active_tab == 'analytics' %} active{% endif %}"
  >Аналитика</a>
</nav>
