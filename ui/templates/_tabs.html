{% if is_admin %}
<nav class="tabs admin-tabs desktop-tabs" aria-label="Админ-разделы">
  <a
    href="{{ url_for('index', tab='no_volume', sort=nav_sort) }}"
    class="tab{% if active_tab == 'no_volume' %} active{% endif %}"
  >Без объема{% if no_volume_count is not none %} <span class="tab-count">{{ no_volume_count }}</span>{% endif %}</a>
  <a
    href="{{ url_for('index', tab='archived', sort=nav_sort) }}"
    class="tab{% if active_tab == 'archived' %} active{% endif %}"
  >Архив{% if archived_count is defined %} <span class="tab-count">{{ archived_count }}</span>{% endif %}</a>
  <a
    href="{{ url_for('catalog') }}"
    class="tab{% if active_tab == 'catalog' %} active{% endif %}"
  >Каталог{% if catalog_new_count %} <span class="tab-count">{{ catalog_new_count }}</span>{% endif %}</a>
  <a
    href="{{ url_for('analytics') }}"
    class="tab{% if active_tab == 'analytics' %} active{% endif %}"
  >Аналитика</a>
  <a
    href="{{ url_for('logout') }}"
    class="tab tab-logout"
  >Выйти</a>
</nav>
{% endif %}
