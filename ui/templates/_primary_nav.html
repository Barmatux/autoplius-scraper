<nav class="primary-nav desktop-primary-nav" aria-label="Основное меню">
  <a
    href="{{ url_for('index', tab='all', sort=nav_sort) }}"
    class="tab{% if active_tab is defined and active_tab == 'all' %} active{% endif %}"
  >Объявления</a>
  <div class="import-presets" data-import-presets>
    <button
      type="button"
      class="tab import-presets-trigger"
      data-import-presets-trigger
      aria-expanded="false"
      aria-haspopup="true"
    >Топ модели для импорта</button>
    <div class="import-presets-menu" data-import-presets-menu hidden>
      {% for preset in import_presets %}
      <a href="{{ preset.href }}" class="import-preset-link">{{ preset.label }}</a>
      {% endfor %}
    </div>
  </div>
  <a
    href="{{ url_for('index', tab='electric', sort=nav_sort) }}"
    class="tab{% if active_tab is defined and active_tab == 'electric' %} active{% endif %}"
  >Электро{% if electric_count is defined and electric_count is not none %} <span class="tab-count">{{ electric_count }}</span>{% endif %}</a>
</nav>
<script src="{{ url_for('static', filename='import_presets.js') }}?v=20260908a" defer></script>
