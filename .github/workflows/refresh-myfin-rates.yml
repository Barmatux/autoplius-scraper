# Refresh myfin.by exchange rates on the VM every 30 minutes.
#
# GitHub runners fetch myfin.by and write rates into SQLite on the VM
# (exchange_rates table). The production VM cannot reach myfin.by (HTTP 423).
#
# Uses the same secrets as deploy-vm.yml:
#   VM_HOST, VM_USER, VM_SSH_PRIVATE_KEY

name: Refresh myfin rates

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-myfin-rates
  cancel-in-progress: true

jobs:
  refresh:
    name: Fetch myfin → VM DB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependency
        run: pip install beautifulsoup4

      - name: Fetch myfin rates
        run: |
          set -euo pipefail
          python3 tools/refresh_myfin_rates.py --force --print-json > /tmp/myfin-pairs.json
          cat /tmp/myfin-pairs.json

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Save rates to VM database
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          APP_DIR="/opt/autoplius-scraper"
          DB_PATH="/var/lib/autoplius-scraper/data/autoplius.db"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "sudo -u autoplius env PYTHONPATH='${APP_DIR}' DB_PATH='${DB_PATH}' '${APP_DIR}/.venv/bin/python' '${APP_DIR}/tools/refresh_myfin_rates.py' --apply-json -" \
            < /tmp/myfin-pairs.json

      - name: Restart UI
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            'sudo systemctl restart autoplius-ui.service && sleep 2 && systemctl is-active autoplius-ui.service'
