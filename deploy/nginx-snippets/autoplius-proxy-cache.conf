# Include inside location / (after proxy_pass is fine either order).
# Anonymous humans + bots share nginx proxy_cache; logged-in / private paths bypass.
# Longer TTL cuts Yandex/Google origin load (session users still bypass).

proxy_cache autoplius_pages;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_valid 200 20m;
proxy_cache_valid 301 302 10m;
proxy_cache_valid 404 30s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock on;
proxy_cache_bypass $autoplius_skip_cache;
proxy_no_cache $autoplius_skip_cache;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
proxy_hide_header X-Page-Cache;
proxy_hide_header X-Response-Time;
add_header X-Proxy-Cache $upstream_cache_status always;
add_header X-Bot-Cache $upstream_cache_status always;
