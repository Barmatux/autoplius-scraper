# Deny AI training/scraper bots on HTML.
# Search engines (Googlebot/Yandex) are NOT in $autoplius_ai_bot — rate-limited instead.
# Keep /robots.txt reachable via a dedicated location= so crawlers can read Disallow.

if ($autoplius_ai_bot = 1) {
    return 403;
}

# Empty $autoplius_search_limit_key => no limit for humans / non-search UAs.
limit_req zone=autoplius_search_bots burst=12 nodelay;
