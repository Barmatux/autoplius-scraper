# Shared zone + bot UA map for autoplius HTML proxy_cache (http context).
# Installed to /etc/nginx/conf.d/autoplius-bot-cache.conf

proxy_cache_path /var/cache/nginx/autoplius
                 levels=1:2
                 keys_zone=autoplius_pages:32m
                 max_size=512m
                 inactive=60m
                 use_temp_path=off;

map $http_user_agent $autoplius_is_bot {
    default 0;
    ~*(?i)(yandex|googlebot|bingbot|baiduspider|duckduckbot|slurp|facebookexternalhit|semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider|gptbot|claudebot|amazonbot|applebot|twitterbot) 1;
}

# Humans skip nginx cache (Flask short-TTL cache still applies). Bots use shared cache.
map $autoplius_is_bot $autoplius_skip_cache {
    default 1;
    1 0;
}
