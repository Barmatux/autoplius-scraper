# Shared zone, bot/session maps, and timing log format (http context).
# Installed to /etc/nginx/conf.d/autoplius-cache.conf

proxy_cache_path /var/cache/nginx/autoplius
                 levels=1:2
                 keys_zone=autoplius_pages:64m
                 max_size=1g
                 inactive=180m
                 use_temp_path=off;

map $http_user_agent $autoplius_is_bot {
    default 0;
    ~*(?i)(yandex|googlebot|bingbot|baiduspider|duckduckbot|slurp|facebookexternalhit|semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider|gptbot|chatgpt-user|oai-searchbot|claudebot|anthropic|amazonbot|applebot|twitterbot|ccbot|google-extended|meta-externalagent|cohere-ai|perplexity) 1;
}

# Flask session cookie => personalized pages (favorites, RB prices) — do not cache.
map $http_cookie $autoplius_has_session {
    default 0;
    ~*session= 1;
}

# Auth / mutating / private paths — always bypass cache.
map $request_uri $autoplius_private_uri {
    default 0;
    ~*^/(admin|api|login|logout|register|cabinet|favorites)(/|\\?|$) 1;
}

# Skip cache when session present OR private URI. Otherwise cache humans + bots.
map "$autoplius_has_session$autoplius_private_uri" $autoplius_skip_cache {
    default 1;
    "00" 0;
}

# Collapse equivalent home query variants onto one cache entry.
# Filtered URLs (make/model/…) keep full $request_uri.
map $request_uri $autoplius_cache_uri {
    default                     $request_uri;

    ~*^/\?$                     /;
    ~*^/\?tab=all$              /;
    ~*^/\?sort=added_desc$      /;
    ~*^/\?tab=all&sort=added_desc$ /;
    ~*^/\?sort=added_desc&tab=all$ /;
    ~*^/\?tab=all&sort=added_desc&page=1$ /;
    ~*^/\?page=1&sort=added_desc&tab=all$ /;
    ~*^/\?view=cards$           /?view=cards;
    ~*^/\?tab=all&sort=added_desc&view=cards$ /?view=cards;
    ~*^/\?sort=added_desc&tab=all&view=cards$ /?view=cards;
    ~*^/\?view=cards&tab=all&sort=added_desc$ /?view=cards;
}

log_format autoplius_timing escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"rt":$request_time,'
    '"urt":"$upstream_response_time",'
    '"uht":"$upstream_header_time",'
    '"uct":"$upstream_connect_time",'
    '"cache":"$upstream_cache_status",'
    '"bot":$autoplius_is_bot,'
    '"skip":$autoplius_skip_cache,'
    '"ref":"$http_referer",'
    '"ua":"$http_user_agent"'
    '}';
