# AI / scraper bots that overload Flask /media (http context).
# Installed alongside autoplius-cache.conf into /etc/nginx/conf.d/

map $http_user_agent $autoplius_ai_bot {
    default 0;
    ~*(?i)(gptbot|chatgpt-user|oai-searchbot|claudebot|anthropic-ai|claude-web|bytespider|ccbot|google-extended|meta-externalagent|meta-externalfetcher|cohere-ai|perplexitybot|diffbot|img2dataset|amazonbot) 1;
}

# Empty key => no rate limit (humans + search bots). AI bots => 2 req/s per IP.
map $autoplius_ai_bot $autoplius_ai_limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $autoplius_ai_limit_key zone=autoplius_ai_bots:10m rate=2r/s;
limit_req_status 429;
