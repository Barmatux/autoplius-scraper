# AI / scraper bots that overload the UI (http context).
# Does NOT match Googlebot / Yandex / Bing — those stay for SEO (rate-limited below).

map $http_user_agent $autoplius_ai_bot {
    default 0;
    ~*(?i)(gptbot|chatgpt-user|oai-searchbot|claudebot|anthropic-ai|claude-web|bytespider|ccbot|google-extended|meta-externalagent|meta-externalfetcher|cohere-ai|perplexitybot|diffbot|img2dataset|amazonbot) 1;
}

# Kept for optional burst limits on non-blocked paths; empty key => no limit.
map $autoplius_ai_bot $autoplius_ai_limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $autoplius_ai_limit_key zone=autoplius_ai_bots:10m rate=1r/s;

# Search crawlers (SEO): allow crawl but cap RPS so one bot cannot saturate gunicorn.
# Tight UA match — do not use bare "yandex" (would hit YaBrowser users).
map $http_user_agent $autoplius_search_bot {
    default 0;
    ~*(?i)(googlebot|google-inspectiontool|bingbot|yandex(bot|images|video|mobilebot|webmaster|metrika)|duckduckbot|baiduspider|applebot|slurp) 1;
}

map $autoplius_search_bot $autoplius_search_limit_key {
    0 "";
    1 $binary_remote_addr;
}

# ~3 r/s per bot IP with burst below — humans (empty key) are unlimited.
limit_req_zone $autoplius_search_limit_key zone=autoplius_search_bots:10m rate=3r/s;

limit_req_status 429;
